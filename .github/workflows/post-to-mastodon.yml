name: post to Mastodon

on:
  push:
    branches:
      - main
    paths:
      - 'content/posts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-to-mastodon:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: announce newly published posts
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python3 scripts/mastodon_posts.py --send
